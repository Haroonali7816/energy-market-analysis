<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#ffffff"/>

  <!-- SMARD API -->
  <rect x="30" y="190" width="150" height="90" rx="10" fill="#e7f0fd" stroke="#316dca" stroke-width="1.5"/>
  <text x="105" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a63">SMARD API</text>
  <text x="105" y="246" text-anchor="middle" font-size="11" fill="#3a5a85">Bundesnetzagentur</text>
  <text x="105" y="260" text-anchor="middle" font-size="11" fill="#3a5a85">generation, load, price</text>

  <!-- Ingestion -->
  <rect x="235" y="190" width="150" height="90" rx="10" fill="#e9f5e9" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="310" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#1e5c2a">Ingestion</text>
  <text x="310" y="240" text-anchor="middle" font-size="11" fill="#2f6b3a">smard_client.py</text>
  <text x="310" y="254" text-anchor="middle" font-size="11" fill="#2f6b3a">retries, pagination,</text>
  <text x="310" y="267" text-anchor="middle" font-size="11" fill="#2f6b3a">raw JSON to disk</text>

  <!-- Loader -->
  <rect x="440" y="190" width="150" height="90" rx="10" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="515" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#7a5b06">Loader</text>
  <text x="515" y="240" text-anchor="middle" font-size="11" fill="#8a6b16">load_to_star_schema.py</text>
  <text x="515" y="254" text-anchor="middle" font-size="11" fill="#8a6b16">parses raw JSON,</text>
  <text x="515" y="267" text-anchor="middle" font-size="11" fill="#8a6b16">bulk loads facts/dims</text>

  <!-- Star schema DB -->
  <rect x="645" y="170" width="160" height="130" rx="10" fill="#f3e9fb" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="725" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Star Schema</text>
  <text x="725" y="217" text-anchor="middle" font-size="10.5" fill="#5b21b6">SQLite (energy_market.db)</text>
  <text x="725" y="238" text-anchor="middle" font-size="10.5" fill="#5b21b6">dim_datetime  dim_region</text>
  <text x="725" y="253" text-anchor="middle" font-size="10.5" fill="#5b21b6">dim_energy_source</text>
  <text x="725" y="272" text-anchor="middle" font-size="10.5" fill="#5b21b6">fact_generation  fact_market</text>

  <!-- Validation -->
  <rect x="645" y="350" width="160" height="90" rx="10" fill="#fdeaea" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="725" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#7a1717">Validation</text>
  <text x="725" y="400" text-anchor="middle" font-size="11" fill="#8a2727">validate_data.py</text>
  <text x="725" y="414" text-anchor="middle" font-size="11" fill="#8a2727">coverage, outliers,</text>
  <text x="725" y="427" text-anchor="middle" font-size="11" fill="#8a2727">known-fact checks</text>

  <!-- Power BI -->
  <rect x="850" y="60" width="140" height="90" rx="10" fill="#fdf0f5" stroke="#c2255c" stroke-width="1.5"/>
  <text x="920" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#7a1440">Power BI</text>
  <text x="920" y="110" text-anchor="middle" font-size="11" fill="#8a2050">ODBC connection</text>
  <text x="920" y="124" text-anchor="middle" font-size="11" fill="#8a2050">star schema model,</text>
  <text x="920" y="137" text-anchor="middle" font-size="11" fill="#8a2050">DAX measures, charts</text>

  <!-- Written analysis -->
  <rect x="850" y="330" width="140" height="90" rx="10" fill="#e9f7f5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="920" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#0b4f49">Written Analysis</text>
  <text x="920" y="380" text-anchor="middle" font-size="11" fill="#125e56">written_analysis.md</text>
  <text x="920" y="394" text-anchor="middle" font-size="11" fill="#125e56">findings, caveats,</text>
  <text x="920" y="407" text-anchor="middle" font-size="11" fill="#125e56">honest limitations</text>

  <!-- Arrows -->
  <path d="M180,235 L233,235" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M385,235 L438,235" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M590,225 L643,220" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M725,300 L725,348" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M805,210 C830,180 830,150 848,120" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M805,380 L848,380" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M920,150 C920,240 920,240 920,328" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" fill="none"/>

  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">German Energy Market Analytics — Pipeline</text>
  <text x="920" y="170" text-anchor="middle" font-size="10" fill="#8a8f98" font-style="italic">informs</text>
</svg>
